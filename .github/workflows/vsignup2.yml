name: vsignup2
"on": workflow_dispatch
jobs:
  s:
    runs-on: ubuntu-latest
    steps:
      - run: |
          pip install --quiet playwright requests 2>&1 | tail -1
          cat > /tmp/s.py <<'PY'
import json,re,time,random,string,urllib.request,ssl,sys,os
CTX=ssl.create_default_context()
def http(u,m="GET",d=None,h=None):
    r=urllib.request.Request(u,method=m,data=(json.dumps(d).encode() if d is not None else None),
        headers={"Content-Type":"application/json","User-Agent":"Mozilla/5.0",**(h or {})})
    try:
        with urllib.request.urlopen(r,timeout=25,context=CTX) as x:
            b=x.read().decode()
            try:return x.status,json.loads(b)
            except:return x.status,b
    except Exception as e:return -1,str(e)[:150]
st,doms=http("https://api.internal.temp-mail.io/api/v3/domains")
names=[d["name"] for d in (doms.get("domains") or [])] if isinstance(doms,dict) else []
dom=names[0]; local="glv"+"".join(random.choices(string.ascii_lowercase+string.digits,k=10))
st,mb=http("https://api.internal.temp-mail.io/api/v3/email/new","POST",{"names":[local],"domain":dom})
email=(mb.get("email") if isinstance(mb,dict) else None) or (local+"@"+dom)
print("MAILBOX",email,flush=True)
def code():
    for i in range(16):
        time.sleep(3)
        st,ms=http(f"https://api.internal.temp-mail.io/api/v3/email/{email}/messages")
        arr=ms if isinstance(ms,list) else (ms.get("messages") or [])
        for m in arr:
            blob=(m.get("subject") or "")+" "+(m.get("body_text") or "")
            mm=re.search(r"\b(\d{6})\b",blob)
            if mm: return mm.group(1)
    return None
from playwright.sync_api import sync_playwright
with sync_playwright() as p:
    b=p.chromium.launch(args=["--no-sandbox"],channel="chrome")
    pg=b.new_context(locale="en-US",user_agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/152.0.0.0 Safari/537.36").new_page()
    pg.goto("https://vercel.com/signup",wait_until="domcontentloaded",timeout=60000); pg.wait_for_timeout(6000)
    for t in ["Continue with Email","Email"]:
        try: pg.click(f"text={t}",timeout=4000); break
        except: pass
    pg.wait_for_timeout(2500)
    try: pg.fill("input[type=email]",email,timeout=8000); print("FILLED",flush=True)
    except Exception as e: print("FILLERR",str(e)[:100],flush=True)
    for t in ["Continue","Sign Up","Create Account"]:
        try: pg.click(f"button:has-text('{t}')",timeout=2500); break
        except: pass
    pg.wait_for_timeout(9000)
    body=pg.inner_text("body"); print("BODY",body[:250].replace("\n"," | "),flush=True)
    if "try again" in body.lower() or "different sign up" in body.lower(): print("RESULT=BLOCKED",flush=True); b.close(); sys.exit(0)
    c=code(); print("CODE",c,flush=True)
    if c:
        try:
            i=pg.query_selector("input")
            if i: i.click()
            pg.keyboard.type(c,delay=140); pg.wait_for_timeout(800); pg.keyboard.press("Enter")
        except Exception as e: print("CODEERR",str(e)[:100],flush=True)
        pg.wait_for_timeout(18000)
    print("URL",pg.url,flush=True); print("BODY2",pg.inner_text("body")[:300].replace("\n"," | "),flush=True)
    pg.context.storage_state(path="/tmp/vs.json")
    print("STATE_OK",os.path.exists("/tmp/vs.json"),flush=True)
    b.close()
PY
          python3 /tmp/s.py 2>&1
      - name: up
        if: always()
        uses: actions/upload-artifact@v4
        with: {name: vercel-state, path: /tmp/vs.json, if-no-files-found: ignore}
